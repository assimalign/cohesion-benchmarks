# Runs the BenchmarkDotNet suites (CONVENTIONS.md) against a cohesion CI build and keeps their history.
#
# The suites restore Assimalign.Cohesion.* from the Assimalign GitHub Packages feed, where cohesion's CI publishes every
# main build (10.0.0-preview.0.ci.<run>) and every same-repository pull request build (10.0.0-preview.0.pr.<pr>.<run>).
#
# - Pull requests and pushes that touch the suites: every suite under the `dry` profile, against the pinned build
#   (CohesionPackageVersion in Directory.Build.props). A benchmark that no longer builds or throws fails the check.
#   Nothing is recorded.
# - Weekly, on demand (workflow_dispatch), and when cohesion signals a new main build (repository_dispatch
#   `cohesion-main`, optional client_payload.version): the `ci` profile against the newest main build unless told
#   otherwise. Each suite's results become two series per benchmark, median time and allocated bytes, appended to the
#   history on the gh-pages branch (history/, charted by GitHub Pages). A regression past the threshold comments on the
#   commit and fails the run. Only main builds are recorded; a measured pull request build is reported, not recorded.
#
# Secrets (Settings -> Secrets and variables -> Actions), optional:
#   COHESION_PACKAGES_TOKEN          a token with read:packages, used instead of the workflow token to read the feed
#                                    and cohesion's run history when the workflow token cannot
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables), all optional:
#   BENCHMARK_RUNNER                 self-hosted runner label for the Linux legs (benchmark-linux-x64)
#   BENCHMARK_RUNNER_WINDOWS         self-hosted runner label for the Windows legs (benchmark-windows-x64)
#                                    Used only by the weekly schedule and by pushes, and only on main; every other
#                                    event, and every event when unset, runs on the GitHub-hosted image. The
#                                    self-hosted machines are on Mondays 00:00-08:00 UTC only, so a push to main
#                                    outside that window queues until Monday and fails if that is over 24 hours away.
#                                    Their results record under their own series, "(self-hosted)", never into the
#                                    hosted ones. macOS always runs hosted.
#   BENCHMARK_TIME_THRESHOLD        alert when median time grows past this (default 150%; shared runners are noisy)
#   BENCHMARK_ALLOCATION_THRESHOLD   alert when allocated bytes grow past this (default 110%; allocations are exact)
#   BENCHMARK_ALERT_USERS            "@user1,@user2" to mention in regression comments
name: benchmarks

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "harness/**"
      - "scripts/**"
      - "Directory.Build.*"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/benchmarks.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "harness/**"
      - "scripts/**"
      - "Directory.Build.*"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/benchmarks.yml"
  schedule:
    # Mondays, inside the self-hosted runners' 02:00-08:00 UTC measuring window; off the top of the hour, when
    # GitHub delays scheduled runs.
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      cohesion-version:
        description: "Cohesion CI package version to measure; empty for the newest main build, `pinned` for the pin, #<number> for a cohesion pull request's newest build"
        default: ""
      areas:
        description: Comma-separated areas (ObjectPool,Http,Web); empty for every suite
        default: ""
      profile:
        description: ci records history (main builds only); dry only checks that the suites run
        type: choice
        options: [ci, dry]
        default: ci
      all-os:
        description: Also measure on Windows and macOS, which otherwise happens only on main and on the nightly.
        type: boolean
        default: false
      aot:
        description: Also measure the NativeAOT leg (only the cases marked [BenchmarkCategory("Aot")]).
        type: boolean
        default: false
  repository_dispatch:
    types: [cohesion-main]

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      legs: ${{ steps.plan.outputs.legs }}
      profile: ${{ steps.plan.outputs.profile }}
      record: ${{ steps.plan.outputs.record }}
      cohesion-version: ${{ steps.plan.outputs.cohesion-version }}
      cohesion-commit: ${{ steps.plan.outputs.cohesion-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Resolve-CohesionVersion.ps1 reads cohesion's public CI Packages run history through the GitHub CLI.
      - id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.COHESION_PACKAGES_TOKEN || github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_VERSION: ${{ inputs.cohesion-version }}
          INPUT_AREAS: ${{ inputs.areas }}
          INPUT_ALL_OS: ${{ inputs.all-os }}
          INPUT_AOT: ${{ inputs.aot }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          LINUX_RUNNER: ${{ vars.BENCHMARK_RUNNER }}
          WINDOWS_RUNNER: ${{ vars.BENCHMARK_RUNNER_WINDOWS }}
        run: |
          $profile = switch ($env:EVENT) {
            'workflow_dispatch' { $env:INPUT_PROFILE }
            'schedule' { 'ci' }
            'repository_dispatch' { 'ci' }
            default { 'dry' }
          }

          # Pull requests and pushes check the suites against the pin; the measuring events follow cohesion main
          # unless the dispatch names a build.
          $request = switch ($env:EVENT) {
            'workflow_dispatch' { "$env:INPUT_VERSION".Trim() }
            'repository_dispatch' { "$env:DISPATCH_VERSION".Trim() }
            'schedule' { '' }
            default { 'pinned' }
          }

          $resolve = './scripts/Resolve-CohesionVersion.ps1'
          if ($request -eq 'pinned') {
            $pinned = (Select-Xml -Path Directory.Build.props -XPath '//CohesionPackageVersion').Node.InnerText.Trim()
            # The commit only labels a dry run; a failed lookup must not fail the check.
            $build = try { & $resolve -Version $pinned }
                     catch {
                       Write-Host "::warning::Could not look up the commit behind cohesion $($pinned): $($_.Exception.Message)"
                       [pscustomobject]@{ Version = $pinned; Commit = 'unknown'; Channel = 'ci'; RunUrl = '' }
                     }
          }
          elseif ($request -match '^#?(?<pr>\d+)$') { $build = & $resolve -PullRequest ([int]$Matches.pr) }
          elseif ($request -and $request -ne 'main') { $build = & $resolve -Version $request }
          else { $build = & $resolve }

          $record = $profile -eq 'ci' -and $build.Channel -eq 'ci'
          if ($profile -eq 'ci' -and -not $record) {
            Write-Host "::notice::cohesion $($build.Version) is a pull request build; its results are reported, not recorded."
          }

          $suites = ./scripts/Invoke-Benchmarks.ps1 -List -AsJson -Area $env:INPUT_AREAS
          "profile=$profile" >> $env:GITHUB_OUTPUT
          "record=$($record.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "cohesion-version=$($build.Version)" >> $env:GITHUB_OUTPUT
          "cohesion-commit=$($build.Commit)" >> $env:GITHUB_OUTPUT
          "suites=$suites" >> $env:GITHUB_OUTPUT

          # ---- the measurement legs -------------------------------------------------------------------------
          # A leg is one (os, framework, runtime) the suites are measured on. The baseline leg -- Linux, the first
          # framework, the JIT -- carries no label, so its series keep the names they have recorded under since the
          # beginning; every other leg appends "(label)" to the series name and records alongside rather than into
          # it. Mixing two machines into one series would make every point a comparison between runners.
          $multiOs = $env:EVENT -in @('schedule', 'repository_dispatch') -or
                     $env:GITHUB_REF -eq 'refs/heads/main' -or
                     $env:INPUT_ALL_OS -eq 'true'
          $wantAot = $env:EVENT -in @('schedule', 'repository_dispatch') -or
                     $env:GITHUB_REF -eq 'refs/heads/main' -or
                     $env:INPUT_AOT -eq 'true'

          # Only the monikers cohesion actually ships resolve; the list lives with the build so adding the next
          # framework is one edit there rather than one here.
          $tfms = @((Select-Xml -Path Directory.Build.props -XPath '//BenchmarkTargetFrameworks').Node.InnerText.Trim() -split ';' |
                    Where-Object { $_ })
          if (-not $tfms) { $tfms = @('net10.0') }

          # The self-hosted machines take the Linux and Windows legs of the weekly schedule and of pushes, on main
          # only. Pull requests, dispatches, repository_dispatch, and other branches always run hosted, and so does
          # everything when the variables are unset. A self-hosted leg records under its own "(self-hosted)" series:
          # its numbers are a different machine's, and mixing them into the hosted history would read as a step change.
          $selfHosted = $env:GITHUB_REF -eq 'refs/heads/main' -and $env:EVENT -in @('schedule', 'push')

          $osLegs = @([pscustomobject]@{ os = 'ubuntu-latest'; name = 'linux'; runner = $env:LINUX_RUNNER })
          if ($multiOs) {
            $osLegs += [pscustomobject]@{ os = 'windows-latest'; name = 'windows'; runner = $env:WINDOWS_RUNNER }
            $osLegs += [pscustomobject]@{ os = 'macos-latest';   name = 'macos';   runner = '' }
          }

          # NativeAOT compiles a project per benchmark case, so it runs only where a case opted in, and only on
          # Linux: three native toolchains for the same question is not worth the runner time.
          $aotAreas = @()
          if ($wantAot) {
            $aotAreas = @(Get-ChildItem benchmarks -Recurse -Filter '*.cs' -File |
              Select-String -SimpleMatch 'BenchmarkRuntimes.Category' -List |
              # Non-greedy, and anchored on the scope segment rather than on "benchmarks": the repository itself
              # is called cohesion-benchmarks and every suite has a second "benchmarks" folder inside the area,
              # so a greedy match lands on the wrong one and yields the whole path.
              ForEach-Object { $_.Path -replace '^.*?[\\/](?:libraries|resources)[\\/]([^\\/]+)[\\/].*$', '$1' } |
              Sort-Object -Unique)
            Write-Host "AOT cases found in: $($aotAreas -join ', ')"
          }

          $jobs = foreach ($suite in ($suites | ConvertFrom-Json)) {
            foreach ($tfm in $tfms) {
              foreach ($leg in $osLegs) {
                foreach ($runtime in @('jit', 'aot')) {
                  if ($runtime -eq 'aot' -and ($leg.name -ne 'linux' -or $suite.area -notin $aotAreas)) { continue }

                  $onSelfHosted = $selfHosted -and $leg.runner

                  # The baseline combination keeps the unlabelled series name it has always recorded under.
                  $parts = @()
                  if ($leg.name -ne 'linux') { $parts += $leg.name }
                  if ($tfm -ne $tfms[0]) { $parts += $tfm }
                  if ($runtime -ne 'jit') { $parts += $runtime }
                  if ($onSelfHosted) { $parts += 'self-hosted' }

                  [pscustomobject]@{
                    scope   = $suite.scope
                    area    = $suite.area
                    name    = $suite.name
                    os      = $leg.os
                    runs_on = if ($onSelfHosted) { $leg.runner } else { $leg.os }
                    tfm     = $tfm
                    runtime = $runtime
                    variant = ($parts -join ', ')
                    id      = (@($leg.name, $tfm, $runtime) -join '-')
                  }
                }
              }
            }
          }

          $jobsJson = ConvertTo-Json -InputObject @($jobs) -Compress -Depth 4
          "legs=$jobsJson" >> $env:GITHUB_OUTPUT

          $source = if ($build.RunUrl) { "[$($build.Version)]($($build.RunUrl))" } else { $build.Version }
          $legNames = (@($jobs) | ForEach-Object { $_.id } | Sort-Object -Unique) -join ', '
          "Cohesion $source (commit ``$($build.Commit)``), profile ``$profile``, $(if ($record) { 'recorded' } else { 'not recorded' })" >> $env:GITHUB_STEP_SUMMARY
          "`n$(@($suites | ConvertFrom-Json).Count) suites x legs ``$legNames`` = $(@($jobs).Count) measuring jobs." >> $env:GITHUB_STEP_SUMMARY
          Write-Host "profile=$profile record=$record cohesion=$($build.Version) ($($build.Commit))"
          Write-Host "legs=$legNames jobs=$(@($jobs).Count)"
          Write-Host $suites

  run:
    needs: plan
    if: needs.plan.outputs.legs != '[]'
    name: ${{ matrix.leg.scope }}/${{ matrix.leg.area }} [${{ matrix.leg.id }}]
    # Chosen per leg by the plan job: a self-hosted label for the Linux and Windows legs of the weekly schedule and
    # of pushes to main, the hosted image for everything else.
    runs-on: ${{ matrix.leg.runs_on }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      # The organization's plan runs at most 20 jobs at once, 5 of them macOS; a full main run is over a hundred
      # legs, so cap the fan-out rather than letting the queue decide which areas get measured first.
      max-parallel: 12
      matrix:
        leg: ${{ fromJson(needs.plan.outputs.legs) }}
    env:
      # GitHub Packages needs a token with read:packages even to read (nuget.config's `assimalign` source).
      NuGetPackageSourceCredentials_assimalign: Username=${{ github.actor }};Password=${{ secrets.COHESION_PACKAGES_TOKEN || github.token }}
      COHESION_VERSION: ${{ needs.plan.outputs.cohesion-version }}
      COHESION_COMMIT: ${{ needs.plan.outputs.cohesion-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NativeAOT links with the platform toolchain. The Linux images carry clang but not the objwriter headers
      # ILCompiler links against, and a missing one fails late, inside the generated child build.
      - name: Install the NativeAOT prerequisites
        if: matrix.leg.runtime == 'aot' && startsWith(matrix.leg.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Run ${{ matrix.leg.name }} (${{ needs.plan.outputs.profile }}, ${{ matrix.leg.id }})
        shell: pwsh
        run: >
          ./scripts/Invoke-Benchmarks.ps1
          -Scope ${{ matrix.leg.scope }}
          -Area ${{ matrix.leg.area }}
          -Profile ${{ needs.plan.outputs.profile }}
          -Runtime ${{ matrix.leg.runtime }}
          -Tfm ${{ matrix.leg.tfm }}
          -CohesionVersion $env:COHESION_VERSION
          -Output results

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          $commit = $env:COHESION_COMMIT.Substring(0, [Math]::Min(12, $env:COHESION_COMMIT.Length))
          "### ${{ matrix.leg.name }} [${{ matrix.leg.id }}] (${{ needs.plan.outputs.profile }}, cohesion $env:COHESION_VERSION, $commit)" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path results) {
            Get-ChildItem results -Recurse -Filter '*-report-github.md' | ForEach-Object {
              Get-Content $_.FullName | Where-Object { $_ -match '^\|' } >> $env:GITHUB_STEP_SUMMARY
              '' >> $env:GITHUB_STEP_SUMMARY
            }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.leg.scope }}-${{ matrix.leg.area }}-${{ matrix.leg.id }}
          path: results
          if-no-files-found: ignore
          retention-days: 30

  # One writer at a time: every leg appends to the same gh-pages branch.
  record:
    needs: [plan, run]
    if: always() && needs.plan.outputs.record == 'true' && needs.plan.outputs.legs != '[]'
    name: record ${{ matrix.leg.scope }}/${{ matrix.leg.area }} [${{ matrix.leg.id }}]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        leg: ${{ fromJson(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: results-${{ matrix.leg.scope }}-${{ matrix.leg.area }}-${{ matrix.leg.id }}
          path: results

      - name: Convert to history series
        id: convert
        if: steps.download.outcome == 'success'
        shell: pwsh
        env:
          COHESION_VERSION: ${{ needs.plan.outputs.cohesion-version }}
          COHESION_COMMIT: ${{ needs.plan.outputs.cohesion-commit }}
        run: |
          $path = "results/${{ matrix.leg.scope }}/${{ matrix.leg.area }}"
          if (-not (Test-Path $path)) { Write-Host "No results for this suite (it failed to build or run)."; exit 0 }
          ./scripts/ConvertTo-BenchmarkHistory.ps1 -Path $path -TimeOutput time.json -AllocationOutput allocations.json -CohesionVersion $env:COHESION_VERSION -CohesionCommit $env:COHESION_COMMIT
          "ready=true" >> $env:GITHUB_OUTPUT

      # github-action-benchmark appends to an existing branch; create it on the first run. The empty root commit is
      # built without touching the working tree (switching to an orphan branch and back left the job on no branch).
      - name: Ensure the history branch exists
        if: steps.convert.outputs.ready == 'true'
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            root=$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "chore: start benchmark history")
            git push origin "$root:refs/heads/gh-pages"
          fi

      # Both recorders run even when one alerts, so a time regression never costs us the
      # allocation series for that commit; the gate below turns either alert into a red job.
      - name: Record time
        id: time
        if: steps.convert.outputs.ready == 'true'
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          # The baseline leg records under the bare area name, as it always has; every other leg appends its
          # label, so "libraries/Http (windows)" and "libraries/Http (aot)" are series of their own rather than
          # extra points in the Linux one.
          name: ${{ matrix.leg.scope }}/${{ matrix.leg.area }}${{ matrix.leg.variant != '' && format(' ({0})', matrix.leg.variant) || '' }} - time
          tool: customSmallerIsBetter
          output-file-path: time.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: history
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          max-items-in-chart: 120
          summary-always: true
          alert-threshold: ${{ vars.BENCHMARK_TIME_THRESHOLD || '150%' }}
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: ${{ vars.BENCHMARK_ALERT_USERS }}

      - name: Record allocations
        id: allocations
        if: always() && steps.convert.outputs.ready == 'true'
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: ${{ matrix.leg.scope }}/${{ matrix.leg.area }}${{ matrix.leg.variant != '' && format(' ({0})', matrix.leg.variant) || '' }} - allocations
          tool: customSmallerIsBetter
          output-file-path: allocations.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: history
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          max-items-in-chart: 120
          summary-always: true
          alert-threshold: ${{ vars.BENCHMARK_ALLOCATION_THRESHOLD || '110%' }}
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: ${{ vars.BENCHMARK_ALERT_USERS }}

      # continue-on-error above stops one failed recorder from skipping the other, so the
      # alert is re-raised here; without it a regression would land silently.
      - name: Fail on a recorded alert
        if: always() && (steps.time.outcome == 'failure' || steps.allocations.outcome == 'failure')
        run: |
          echo "time: ${{ steps.time.outcome }}  allocations: ${{ steps.allocations.outcome }}"
          echo "::error::A benchmark alert or recording error was reported above. Both metric series were still recorded."
          exit 1
